<!DOCTYPE html>
<html>
<head>
    <title>CSS Class Demo</title>

    <!-- Internal CSS -->
    <style>
        .internal {
            color: blue;
            font-size: 25px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="internal">Internal CSS</h1>

    <!-- Inline CSS -->
    <h2 class="inline" style="color: red;">
        Inline CSS
    </h2>

    <p class="external">
        This is External CSS
    </p>

</body>
</html>
